name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: |
        docker build --file Dockerfile --tag checkpoint-alert:latest .
        docker save checkpoint-alert:latest -o image.tar
    
    - name: Upload artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
