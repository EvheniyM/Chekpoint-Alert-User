name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: |
        docker build --file Dockerfile --tag checkpoint-alert:latest .
        docker tag checkpoint-alert:latest ghcr.io/${{ github.repository_owner }}/checkpoint-alert:latest
    
    - name: Login to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    
    - name: Push to GitHub Packages
      run: docker push ghcr.io/${{ github.repository_owner }}/checkpoint-alert:latest
    
    - name: Upload artifact (optional - если хотите и артефакт тоже)
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
